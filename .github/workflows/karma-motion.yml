name: Project motion asset
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-karma-motion.py
      - .github/workflows/karma-motion.yml
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate GIF
        env:
          KARMA_PROJECT: nextjs-boilerplate
          KARMA_ACCENT: '#b5a7f9'
          KARMA_SECONDARY: '#7965e1'
          KARMA_INDEX: '3'
        run: python scripts/generate-karma-motion.py
      - name: Store generated asset
        run: |
          git add assets/karma-motion.gif
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "media: update project motion"
          git push
